<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar rota do trem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/Cadastrar_rota.css">

        <link rel="stylesheet" href="../assets/css/home.css">

</head>
<body>
    
    <div class="app-container">

        <div class="d-flex h-100">
            <div class="principal">
                <div>
                    <div>
                        <img class="logos" src="../Assets/logos/Logo.png" alt="Logo">
                    </div>

                    <div id="logos_barra_lateral">
                        <div>
                           <a href="../public/home.html">
                        <img class="logos" src="../Assets/logos/icon_rotas.png" alt="">
                        </a>
                    </div>

                    <div>
                        <a href="../public/trens_cadastro.html">
                        <img class="logos" src="../Assets/logos/icon_trem.png" alt="">
                        </a>
                    </div>

                    <div> 
                        <a href="../public/sensor_cadastro.html">
                        <img class="logos" src="../Assets/logos/icon_sensores.png" alt="">
                        </a>
                    </div>

                    <div>
                        <a href="../index.html">
                            <img class="logos" src="../Assets/logos/icon_saida.png" alt="">
                        </a>
                        </div>
                    </div>


                </div>
            </div>
        </div>


        <main class="content">

          
    <section class="painel-cadastro">
        <h1 class="titulo">Cadastrar rota do trem</h1>
        

        <div class="row g-4">
            
          
            <div class="col-lg-8">
                <div class="row g-4">
                    
                    
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Digite a origem do trem</label>
                            <input type="text" placeholder="Coloque a origem">
                        </div>
                    </div>
                    
                    
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Digite o nome da rota</label>
                            <input type="text" placeholder="Coloque o nome da rota">
                        </div>
                    </div>
                    
                    
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Digite o destino</label>
                            <input type="text" placeholder="Coloque o destino">
                        </div>
                    </div>
                    
                    
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Início previsto</label>
                            <input type="time" placeholder="Coloque o inicio previsto">
                        </div>
                    </div>
                    
                   
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Digite o nome do operador</label>
                            <input type="text" placeholder="Coloque o nome do operador">
                        </div>
                    </div>
                    
                  
                    <div class="col-md-6">
                        <div class="card-input">
                            <label>Fim previsto</label>
                            <input type="time" placeholder="horario previsto de chegada">
                        </div>
                    </div>

                </div> 
            </div> 

            
            <div class="col-lg-4 d-flex align-items-center justify-content-center">
                <div class="botao-container">
                    <button class="btn-enviar">Enviar</button>
                </div>
            </div>

        </div>
    </section>


        </main>

    </div>
</body>
</html>
